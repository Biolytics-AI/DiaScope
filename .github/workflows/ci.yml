name: Package CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: diascope-bundle
          path: packages/diascope/dist/diascope.bundle.js
          if-no-files-found: warn
