name: Deploy Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Install package dependencies
        run: npm ci

      - name: Install docs dependencies
        run: npm --prefix docs-site ci

      - name: Install D2
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --
          d2 version

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build package
        run: npm run build

      - name: Record demo GIF
        run: node scripts/record-demo.mjs --out docs-site/public/demo.gif

      - name: Build docs assets and site
        run: npm run docs:prepare-assets && npm --prefix docs-site run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    if: github.event_name == 'push'
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
