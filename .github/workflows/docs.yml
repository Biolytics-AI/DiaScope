name: Deploy Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Assemble docs site
        run: |
          mkdir -p _site
          cp README.md _site/index.md
          cp -r docs/* _site/
          # Jekyll front matter for GitHub Pages theme
          for f in _site/*.md; do
            if ! grep -q "^---" "$f"; then
              title=$(head -1 "$f" | sed 's/^#* *//')
              printf -- "---\ntitle: %s\nlayout: default\n---\n\n" "$title" | cat - "$f" > tmp && mv tmp "$f"
            fi
          done
          cat > _site/_config.yml << 'EOF'
          title: DiaScope
          description: Turn D2 diagrams into narrated interactive stories
          theme: jekyll-theme-minimal
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
