<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vLLM Deployment Controls</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    #svg-host { width: 100%; height: 100%; }
    #svg-host svg { display: block; }
    #panel { width: 320px; display: flex; flex-direction: column; border-left: 1px solid #2d3748; background: #161b27; }
    #step-nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border-bottom: 1px solid #2d3748; }
    .step-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #4a5568; background: transparent; color: #a0aec0; cursor: pointer; font-size: 12px; }
    .step-btn.active { background: #3182ce; border-color: #3182ce; color: #fff; }
    #step-content { flex: 1; overflow-y: auto; padding: 16px; }
    #step-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #4a90d9; margin-bottom: 6px; }
    #step-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    #step-body { font-size: 13px; color: #a0aec0; line-height: 1.6; }
    #toolbar { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #2d3748; }
    #toolbar button { flex: 1; padding: 5px 0; border-radius: 4px; border: 1px solid #4a5568; background: transparent; color: #a0aec0; cursor: pointer; font-size: 11px; }
    #toolbar button:hover { background: #2d3748; }
    #detail-drawer { position: absolute; right: 0; top: 0; width: 280px; height: 100%; background: #1a202c; border-left: 1px solid #2d3748; padding: 16px; transform: translateX(100%); transition: transform 0.2s; overflow-y: auto; z-index: 10; }
    #detail-drawer.open { transform: translateX(0); }
    #drawer-node-id { font-size: 11px; color: #4a90d9; margin-bottom: 8px; font-family: monospace; }
    #edge-tooltip { position: fixed; background: #2d3748; border: 1px solid #4a5568; border-radius: 4px; padding: 6px 10px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 280px; z-index: 100; }
    #edge-tooltip.visible { opacity: 1; }
    .focus-mode .d2-node.dimmed { display: none; }
    .focus-mode .d2-edge.dimmed { display: none; }
  </style>
</head>

ptions: private link (e.g. AWS PrivateLink, Azure Private Endpoint), SD-WAN, or dedicated leased line. BLOCKER.</title></g><g class="TmV0Wm9uZS5tVExT"><g class="shape" ><path d="M 2706 1810 C 2705 1810 2704 1810 2704 1809 L 2577 1732 C 2576 1731 2576 1730 2577 1729 L 2704 1651 C 2705 1650 2707 1650 2709 1651 L 2836 1729 C 2837 1730 2837 1731 2836 1732 L 2708 1809 C 2708 1810 2707 1810 2706 1810 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="2706.000000" y="1727.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="2706.000000" dy="0.000000">🔴 mTLS 1.3</tspan><tspan x="2706.000000" dy="18.500000">(mutual authentication)</tspan></text><title>NEN 7510 §8.24 — TLS 1.3 minimum, mutual: HealthcareProvider client cert (from HSM) authenticates to vLLM endpoint. Server cert must be pinned or CA-constrained.</title></g><g class="TmV0Wm9uZS5XQUY="><g class="shape" ><path d="M 3175 1827 C 3174 1827 3173 1827 3173 1827 L 3046 1771 C 3045 1770 3045 1770 3046 1769 L 3173 1713 C 3174 1712 3176 1712 3178 1713 L 3305 1769 C 3306 1770 3306 1770 3305 1771 L 3177 1827 C 3177 1827 3176 1827 3175 1827 Z" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="3175.000000" y="1767.500000" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="3175.000000" dy="0.000000">🟠 WAF / Rate Limiter</tspan><tspan x="3175.000000" dy="18.500000">(prompt injection guard)</tspan></text><title>NEN 7510 §8.20 — WAF protects against prompt injection and API abuse. Rate limiting prevents exfiltration via repeated inference calls.</title></g><g class="TmV0Wm9uZS5JUEFsbG93bGlzdA=="><g class="shape" ><path d="M 3616 1827 C 3615 1827 3614 1827 3614 1827 L 3487 1771 C 3486 1770 3486 1770 3487 1769 L 3614 1713 C 3615 1712 3617 1712 3619 1713 L 3746 1769 C 3747 1770 3747 1770 3746 1771 L 3618 1827 C 3618 1827 3617 1827 3616 1827 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="3616.000000" y="1767.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="3616.000000" dy="0.000000">🔴 IP Allowlist</tspan><tspan x="3616.000000" dy="18.500000">(HealthcareProvider CIDR only)</tspan></text><title>NEN 7510 §8.20 — vLLM API must be unreachable from the public internet. Ingress restricted to HealthcareProvider&#39;s egress IP range only. Enforced at GPU provider firewall level.</title></g><g class="R1BVUHJvdmlkZXIuUHJvdmlkZXJEb2Nz"><g class="shape" ><rect x="4352.000000" y="1903.000000" width="391.000000" height="413.000000" rx="8.000000" stroke="#fde047" fill="#fef9c3" style="stroke-width:2;" /></g><text x="4547.500000" y="1932.000000" fill="#713f12" class="text" style="text-anchor:middle;font-size:24px">Provider Compliance Prerequisites</text></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNr"><g class="shape" ><rect x="4352.000000" y="2336.000000" width="1450.000000" height="596.000000" rx="8.000000" stroke="#f59e0b" fill="#fef3c7" style="stroke-width:2;" /></g><text x="5077.000000" y="2365.000000" fill="#713f12" class="text" style="text-anchor:middle;font-size:24px">vLLM Deployment</text></g><g class="R1BVUHJvdmlkZXIuSW5mcmFMYXllcg=="><g class="shape" ><rect x="4352.000000" y="2952.000000" width="360.000000" height="577.000000" rx="8.000000" stroke="#f59e0b" fill="#fef3c7" style="stroke-width:2;" /></g><text x="4532.000000" y="2981.000000" fill="#713f12" class="text" style="text-anchor:middle;font-size:24px">Hosting Infrastructure</text></g><g class="TGVnZW5kLk5vZGVUeXBlcy5MX1NlcnZpY2U="><g class="shape" ><ellipse rx="80.000000" ry="28.000000" cx="803.000000" cy="247.000000" stroke="#0284c7" fill="#e0f2fe" class="shape" style="stroke-width:2;" /></g><text x="803.000000" y="252.500000" fill="#0c4a6e" class="text-bold" style="text-anchor:middle;font-size:16px">Service / Process</text></g><g class="TGVnZW5kLk5vZGVUeXBlcy5MX1N0b3Jl"><g class="shape" ><path d="M 723 319 C 723 295 795 295 803 295 C 811 295 883 295 883 319 V 3 ></g><g class="TGVnZW5kLkNvbXBsaWFuY2VTdGF0dXMuTF9BdWRpdA=="><g class="shape" ><rect x="683.000000" y="1412.000000" width="240.000000" height="61.000000" stroke="#d97706" fill="#fff7ed" style="stroke-width:2;" /></g><text x="803.000000" y="1448.000000" fill="#92400e" class="text-bold" style="text-anchor:middle;font-size:16px">🟠 Audit Evidence Required</text></g><g class="TGVnZW5kLkNvbXBsaWFuY2VTdGF0dXMuTF9Db250cmFjdA=="><g class="shape" ><rect x="683.000000" y="1493.000000" width="240.000000" height="61.000000" stroke="#7c3aed" fill="#f3e8ff" style="stroke-width:2;" /></g><text x="803.000000" y="1529.000000" fill="#4c1d95" class="text-bold" style="text-anchor:middle;font-size:16px">🟣 Contractual / DPA Required</text></g><g class="TGVnZW5kLkNvbXBsaWFuY2VTdGF0dXMuTF9UZWNo"><g class="shape" ><rect x="683.000000" y="1574.000000" width="240.000000" height="61.000000" stroke="#2563eb" fill="#eff6ff" style="stroke-width:2;" /></g><text x="803.000000" y="1610.000000" fill="#1e3a8a" class="text-bold" style="text-anchor:middle;font-size:16px">🔵 Technical Data Flow</text></g><g class="R2VyaUNsb3VkLkFjdG9ycy5DbGluaWNpYW4="><g class="shape" ><path d="M 324 2061 H 247 V 2060 C 247 2049 255 2039 269 2034 C 261 2030 257 2023 257 2016 C 257 2005 270 1995 285 1995 C 301 1995 313 2005 313 2016 C 313 2023 309 2029 301 2033 C 314 2038 323 2048 323 2059 V 2060 H 324 Z" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="285.500000" y="2082.000000" fill="#1e3a8a" class="text-bold" style="text-anchor:middle;font-size:16px">Clinician</text></g><g class="R2VyaUNsb3VkLkFjdG9ycy5TeXNBZG1pbg=="><g class="shape" ><path d="M 324 2227 H 207 V 2225 C 207 2205 220 2186 240 2177 C 229 2170 222 2159 222 2146 C 222 2125 242 2107 265 2107 C 289 2107 308 2125 308 2146 C 308 2159 301 2170 290 2178 C 310 2187 323 2205 323 2226 V 2228 H 324 Z" stroke="#2563eb" fill="#dbeafe" style="stroke-width:2;" /></g><text x="265.500000" y="2248.000000" fill="#1e3a8a" class="text-bold" style="text-anchor:middle;font-size:16px">System Admin</text></g><g class="R2VyaUNsb3VkLkFwcExheWVyLkVIUg=="><g class="shape" ><ellipse rx="100.000000" ry="40.000000" cx="821.000000" cy="1895.000000" stroke="#0284c7" fill="#e0f2fe" class="shape" style="stroke-width:2;" /></g><text x="821.000000" y="1900.500000" fill="#0c4a6e" class="text-bold" style="text-anchor:middle;font-size:16px">EHR Application</text></g><g class="R2VyaUNsb3VkLkFwcExheWVyLlBISVByb3h5"><g class="shape" ><path d="M 1196 1864 L 1141 1895 L 1196 1926 L 1306 1926 L 1361 1895 L 1306 1864 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="1251.000000" y="1900.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px">🔴 PHI Stripping Proxy</text><title>NEN 7510 §8.2 — Must strip or pseudonymise all PHI before forwarding prompt to GPU provider. No plaintext patient identifiers may cross the boundary. BLOCKER.</title></g><g class="R2VyaUNsb3VkLlNlY0xheWVyLktleVZhdWx0"><g class="shape" ><path d="M 705 2055 L 815 2055 L 815 2072 L 925 2072 L 925 2142 L 705 2142 Z" stroke="#ea580c" fill="#fff7ed" style="stroke-width:2;" /></g><text x="815.000000" y="2104.700000" fill="#7c2d12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="815.000000" dy="0.000000">🔴 Key Vault / HSM</tspan><tspan x="815.000000" dy="18.500000">(mTLS client certs)</tspan></text><title>NEN 7510 §8.24 — All client TLS certificates and API credentials must be stored in an HSM-backed vault. Rotation policy required.</title></g><g class="R2VyaUNsb3VkLlNlY0xheWVyLklBTUNvbnRyb2w="><g class="shape" ><path d="M 815 2276 C 814 2276 814 2276 813 2276 L 706 2220 C 705 2219 705 2219 706 2218 L 813 2162 C 814 2161 816 2161 817 2162 L 924 2218 C 925 2219 925 2219 924 2220 L 817 2276 C 816 2276 816 2276 815 2276 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="815.000000" y="2216.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="815.000000" dy="0.000000">🔴 IAM / RBAC</tspan><tspan x="815.000000" dy="18.500000">(inference access)</tspan></text><title>NEN 7510 §8.2, §8.18 — Only authorised service accounts and clinician roles may call the vLLM endpoint. No anonymous or overprivileged access.</title></g><g class="R2VyaUNsb3VkLlNlY0xheWVyLlNJRU0="><g class="shape" ><path d="M 729 2325 H 901 C 925 2325 925 2361 925 2365 C 925 2369 925 2405 901 2405 H 729 C 705 2405 705 2369 705 2365 C 705 2361 705 2325 729 2325 Z" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /><path d="M 901 2325 C 877 2325 877 2361 877 2365 C 877 2369 877 2405 901 2405" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="803.000000" y="2362.500000" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="803.000000" dy="0.000000">🟠 SIEM</tspan><tspan x="803.000000" dy="18.500000">(centralised log aggregator)</tspan></text><title>NEN 7510 §8.15, §8.16 — Must aggregate inference audit events from GPU provider. Real-time anomaly detection required.</title></g><g class="R2VyaUNsb3VkLlNlY0xheWVyLkF1ZGl0QXJjaGl2ZQ=="><g class="shape" ><path d="M 1170 2272 H 1395 C 1391 2272 1380 2293 1380 2311 C 1380 2328 1391 2349 1395 2349 H 1170 C 1166 2349 1155 2328 1155 2311 C 1155 2293 1166 2272 1170 2272 Z" stroke="#15803d" fill="#f0fdf4" style="stroke-width:2;" /></g><text x="1275.000000" y="2308.000000" fill="#14532d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1275.000000" dy="0.000000">🟠 Audit Archive</tspan><tspan x="1275.000000" dy="18.500000">(immutable, 7-year retention)</tspan></text><title>NEN 7510 §8.15 — All access to patient data (incl. inference calls involving patient context) must be logged and retained for minimum 7 years. Logs must be tamper-proof.</title></g><g class="R2VyaUNsb3VkLlNlY0xheWVyLkFsZXJ0aW5n"><g class="shape" ><path d="M 1155 2369 V 2426 H 1265 V 2471 L 1295 2426 H 1375 V 2369 H 1155 Z" stroke="#f43f5e" fill="#fff1f2" style="stroke-width:2;" /></g><text x="1265.000000" y="2395.000000" fill="#881337" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1265.000000" dy="0.000000">🟠 Incident Alerting</tspan><tspan x="1265.000000" dy="18.500000">(breach response)</tspan></text><title>NEN 7510 §6.8 — Incident response procedure must explicitly cover GPU provider anomalies, unexpected data exposure, and model integrity failures.</title></g><g class="R2VyaUNsb3VkLk9yZ0xheWVyLkRQQQ=="><g class="shape" ><path d="M 1073 2763 L 1073 2591 L 1333 2591 L 1333 2763 C 1290 2726 1246 2726 1203 2763 C 1160 2800 1116 2800 1073 2763 Z" stroke="#7c3aed" fill="#f3e8ff" style="stroke-width:2;" /></g><text x="1203.000000" y="2662.476222" fill="#4c1d95" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1203.000000" dy="0.000000">🟣 DPA — Sub-processor</tspan><tspan x="1203.000000" dy="18.500000">Agreement (GPU provider)</tspan></text><title>AVG Art. 28 + NEN 7510 §5.21 — GPU provider must be contracted as sub-processor: EU residency, audit rights, breach notification &lt; 72hr, no training on data, deletion on termination.</title></g><g class="R2VyaUNsb3VkLk9yZ0xheWVyLlJpc2tSZWc="><g class="shape" ><path d="M 1073 2889 L 1073 2811 L 1313 2811 L 1313 2889 C 1273 2873 1233 2873 1193 2889 C 1153 2906 1113 2906 1073 2889 Z" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="1193.000000" y="2842.159181" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1193.000000" dy="0.000000">🟠 Risk Register</tspan><tspan x="1193.000000" dy="18.500000">(cloud + AI annex)</tspan></text><title>NEN 7510 §6.1.2 — Risk treatment plan must explicitly cover: rented GPU tenancy risks, inference data interception, model integrity, and residual PHI in prompts.</title></g><g class="R2VyaUNsb3VkLk9yZ0xheWVyLklTTVNVcGRhdGU="><g class="shape" ><path d="M 1093 3000 L 1093 2922 L 1333 2922 L 1333 3000 C 1293 2984 1253 2984 1213 3000 C 1173 3017 1133 3017 1093 3000 Z" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="1213.000000" y="2953.159181" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1213.000000" dy="0.000000">🟠 ISMS Scope Update</tspan><tspan x="1213.000000" dy="18.500000">(external inference)</tspan></text><title>NEN 7510 §5.2 — ISMS scope document must be updated to include the external GPU inference endpoint as an in-scope asset under HealthcareProvider&#39;s information security perimeter.</title></g><g class="R1BVUHJvdmlkZXIuUHJvdmlkZXJEb2NzLklTTzI3MDAx"><g class="shape" ><path d="M 4417 2031 L 4417 1953 L 4677 1953 L 4677 2031 C 4634 2015 4590 2015 4547 2031 C 4504 2048 4460 2048 4417 2031 Z" stroke="#7c3aed" fill="#f3e8ff" style="stroke-width:2;" /></g><text x="4547.000000" y="1984.159181" fill="#4c1d95" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4547.000000" dy="0.000000">🟣 ISO 27001 / SOC 2 Type II</tspan><tspan x="4547.000000" dy="18.500000">(verified before onboarding)</tspan></text><title>NEN 7510 §5.21 — GPU provider must hold current ISO 27001 certification or SOC 2 Type II. Certificate must be validated before onboarding and rechecked annually.</title></g><g class="R1BVUHJvdmlkZXIuUHJvdmlkZXJEb2NzLkVVUmVzaWRlbmN5"><g class="shape" ><path d="M 4417 2142 L 4417 2064 L 4677 2064 L 4677 2142 C 4634 2126 4590 2126 4547 2142 C 4504 2159 4460 2159 4417 2142 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="4547.000000" y="2095.159181" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4547.000000" dy="0.000000">🔴 EU Data Residency</tspan><tspan x="4547.000000" dy="18.500000">(NL or designated EU region)</tspan></text><title>AVG Art. 44 + NEN 7510 — All GPU compute and any ephemeral storage must remain in EU. No prompt data may be routed to or logged in third countries. BLOCKER.</title></g><g class="R1BVUHJvdmlkZXIuUHJvdmlkZXJEb2NzLkF1ZGl0UmlnaHQ="><g class="shape" ><path d="M 4417 2253 L 4417 2175 L 4677 2175 L 4677 2253 C 4634 2237 4590 2237 4547 2253 C 4504 2270 4460 2270 4417 2253 Z" stroke="#7c3aed" fill="#f3e8ff" style="stroke-width:2;" /></g><text x="4547.000000" y="2206.159181" fill="#4c1d95" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4547.000000" dy="0.000000">🟣 Right to Audit Clause</tspan><tspan x="4547.000000" dy="18.500000">(or third-party audit report)</tspan></text><title>NEN 7510 §5.21, AVG Art. 28(3)(h) — Contract must grant HealthcareProvider right to audit GPU provider, or receive annual third-party audit reports (ISAE 3402 / SOC 2).</title></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNrLk1vZGVsSW50ZWdyaXR5"><g class="shape" ><path d="M 4532 2514 C 4531 2514 4530 2514 4530 2514 L 4403 2458 C 4402 2457 4402 2457 4403 2456 L 4530 2400 C 4531 2399 4533 2399 4535 2400 L 4662 2456 C 4663 2457 4663 2457 4662 2458 L 4534 2514 C 4534 2514 4533 2514 4532 2514 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="4532.000000" y="2454.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4532.000000" dy="0.000000">🔴 Model Integrity Check</tspan><tspan x="4532.000000" dy="18.500000">(SHA-256 hash on load)</tspan></text><title>NEN 7510 §8.8 — Model weights must be verified against a published hash at startup. Prevents tampered or backdoored models from being loaded. BLOCKER.</title></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNrLnZMTE1BUEk="><g class="shape" ><path d="M 4963 2445 L 4898 2525 L 4963 2605 L 5093 2605 L 5158 2525 L 5093 2445 Z" stroke="#ca8a04" fill="#fef9c3" style="stroke-width:2;" /></g><text x="5028.000000" y="2522.500000" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="5028.000000" dy="0.000000">vLLM Inference API</tspan><tspan x="5028.000000" dy="18.500000">(OpenAI-compatible endpoint)</tspan></text></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNrLk5vVHJhaW5pbmc="><g class="shape" ><path d="M 5622 2583 C 5621 2583 5620 2583 5620 2582 L 5493 2511 C 5492 2510 5492 2509 5493 2508 L 5620 2438 C 5621 2437 5623 2437 5625 2438 L 5752 2509 C 5753 2510 5753 2511 5752 2512 L 5624 2582 C 5624 2583 5623 2583 5622 2583 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="5622.000000" y="2499.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="5622.000000" dy="0.000000">🔴 No Training on</tspan><tspan x="5622.000000" dy="17.666667">Inference Data</tspan><tspan x="5622.000000" dy="17.666667">(contractual + technical)</tspan></text><title>EU AI Act + NEN 7510 §8.30 — Provider must guarantee: no logging of prompt/response content, no fine-tuning on inference data, no shadow copies. Must be both contractual and technically verifiable.</title></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNrLktWQ2FjaGU="><g class="shape" ><path d="M 5492 2627 C 5492 2603 5609 2603 5622 2603 C 5635 2603 5752 2603 5752 2627 V 2708 C 5752 2732 5635 2732 5622 2732 C 5609 2732 5492 2732 5492 2708 V 2627 Z" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /><path d="M 5492 2627 C 5492 2651 5609 2651 5622 2651 C 5635 2651 5752 2651 5752 2627" stroke="#d97706" fill="#fef3c7" style="stroke-width:2;" /></g><text x="5622.000000" y="2677.000000" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="5622.000000" dy="0.000000">🟠 KV Cache</tspan><tspan x="5622.000000" dy="18.500000">(GPU VRAM only — no disk persist)</tspan></text><title>NEN 7510 §8.1 — Attention KV cache must exist in GPU VRAM only. Must not be paged or swapped to host disk. Verify with provider that VRAM-to-disk swapping is disabled.</title></g><g class="R1BVUHJvdmlkZXIudkxMTVN0YWNrLkluZmVyZW5jZUxvZw=="><g class="shape" ><path d="M 5492 2776 C 5492 2752 5609 2752 5622 2752 C 5635 2752 5752 2752 5752 2776 V 2857 C 5752 2881 5635 2881 5622 2881 C 5609 2881 5492 2881 5492 2857 V 2776 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /><path d="M 5492 2776 C 5492 2800 5609 2800 5622 2800 C 5635 2800 5752 2800 5752 2776" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="5622.000000" y="2826.000000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="5622.000000" dy="0.000000">🔴 Inference Audit Log</tspan><tspan x="5622.000000" dy="18.500000">(per-request, prompt hash only)</tspan></text><title>NEN 7510 §8.15 — Each request must produce an audit event: timestamp, caller ID, prompt hash (NOT plaintext), response hash, latency ms, model version. Forwarded to HealthcareProvider SIEM — not stored at provider.</title></g><g class="R1BVUHJvdmlkZXIuSW5mcmFMYXllci5EZWRpY2F0ZWRUZW5hbnQ="><g class="shape" ><ellipse rx="120.000000" ry="40.000000" cx="4532.000000" cy="3042.000000" stroke="#dc2626" fill="#fee2e2" class="shape" style="stroke-width:2;" /></g><text x="4532.000000" y="3039.500000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4532.000000" dy="0.000000">🔴 Dedicated Tenancy</tspan><tspan x="4532.000000" dy="18.500000">(no shared GPU VRAM)</tspan></text><title>NEN 7510 §8.1 — Even pseudonymised patient data warrants dedicated GPU tenancy. Shared VRAM (multi-tenant GPU) is not acceptable. Confidential compute (Intel TDX, AMD SEV) is an acceptable alternative.</title></g><g class="R1BVUHJvdmlkZXIuSW5mcmFMYXllci5EaXNrRW5jcnlwdA=="><g class="shape" ><path d="M 4402 3126 C 4402 3102 4519 3102 4532 3102 C 4545 3102 4662 3102 4662 3126 V 3207 C 4662 3231 4545 3231 4532 3231 C 4519 3231 4402 3231 4402 3207 V 3126 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /><path d="M 4402 3126 C 4402 3150 4519 3150 4532 3150 C 4545 3150 4662 3150 4662 3126" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="4532.000000" y="3176.000000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4532.000000" dy="0.000000">🔴 Disk Encryption at Rest</tspan><tspan x="4532.000000" dy="18.500000">(OS + swap + container layers)</tspan></text><title>NEN 7510 §8.5 — All storage on the GPU node (OS swap, Docker/container layers, temp files) must be encrypted at rest. Customer-managed keys preferred.</title></g><g class="R1BVUHJvdmlkZXIuSW5mcmFMYXllci5QaHlzaWNhbFNlYw=="><g class="shape" ><ellipse rx="120.000000" ry="53.000000" cx="4532.000000" cy="3304.000000" stroke="#d97706" fill="#fef3c7" class="shape" style="stroke-width:2;" /></g><text x="4532.000000" y="3301.500000" fill="#713f12" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4532.000000" dy="0.000000">🟠 Physical Security</tspan><tspan x="4532.000000" dy="18.500000">(data centre — ISO 27001 annex)</tspan></text><title>NEN 7510 §7.1–7.4 — Physical access controls to the data centre must be audited. Covered by provider&#39;s ISO 27001 certification, specifically Annex A.11.</title></g><g class="R1BVUHJvdmlkZXIuSW5mcmFMYXllci5CcmVhY2hOb3RpZg=="><g class="shape" ><path d="M 4402 3377 V 3434 H 4522 V 3479 L 4552 3434 H 4642 V 3377 H 4402 Z" stroke="#dc2626" fill="#fee2e2" style="stroke-width:2;" /></g><text x="4522.000000" y="3403.000000" fill="#7f1d1d" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="4522.000000" dy="0.000000">🔴 Breach Notification SLA</tspan><tspan x="4522.000000" dy="18.500000">(&lt; 72hr to HealthcareProvider)</tspan></text><title>AVG Art. 33 + NEN 7510 — Provider must notify HealthcareProvider within 24–72hr of any suspected breach. This SLA must be explicit in the DPA / processor agreement.</title></g><g class="R2VyaUNsb3VkLkFwcExheWVyLihFSFIgLSZndDsgUEhJUHJveHkpWzBd data_flow"><marker id="mk-d2-333188412-22514459" markerWidth="10.000000" markerHeight="12.000000" refX="7.000000" refY="6.000000" viewBox="0.000000 0.000000 10.000000 12.000000" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0.000000,0.000000 10.000000,6.000000 0.000000,12.000000" fill="#2563eb" class="connection" stroke-width="2" /> </marker><path d="M 924.000000 18
