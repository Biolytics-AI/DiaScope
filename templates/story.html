<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{META_TITLE}}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { height: 100vh; font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a202c; }
    #story-shell { display: flex; height: 100vh; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; min-width: 0; background-color: #f5f7fa; background-image: radial-gradient(circle, #d0d7e3 1.5px, transparent 1.5px); background-size: 22px 22px; }
    #svg-host { width: 100%; height: 100%; }
    #svg-host svg { display: block; }
    #panel { width: min(320px, 35%); display: flex; flex-direction: column; border-left: 1px solid #e2e8f0; background: #ffffff; position: relative; transition: width 0.18s ease; }
    #panel-header { display: flex; justify-content: flex-start; padding: 10px 12px 0; }
    #btn-panel-toggle { width: 28px; height: 28px; border-radius: 999px; border: 1px solid #cbd5e0; background: rgba(255,255,255,0.92); color: #718096; cursor: pointer; font-size: 14px; line-height: 1; }
    #btn-panel-toggle:hover { background: #edf2f7; }
    #step-nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border-bottom: 1px solid #e2e8f0; }
    .step-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #cbd5e0; background: transparent; color: #718096; cursor: pointer; font-size: 12px; }
    .step-btn:hover { background: #edf2f7; }
    .step-btn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    #step-content { flex: 1; overflow-y: auto; padding: 16px; scrollbar-width: none; }
    #step-content::-webkit-scrollbar { display: none; }
    #step-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #2563eb; margin-bottom: 8px; font-weight: 500; }
    #step-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; line-height: 1.4; color: #1a202c; }
    #step-body { font-size: 13px; color: #4a5568; line-height: 1.7; }
    #step-body p { margin-bottom: 0.75em; }
    #step-body p:last-child { margin-bottom: 0; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid #e2e8f0; }
    #toolbar button { flex: 1; padding: 5px 0; border-radius: 4px; border: 1px solid #cbd5e0; background: transparent; color: #4a5568; cursor: pointer; font-size: 11px; }
    #toolbar button:hover { background: #edf2f7; }
    #story-shell.panel-collapsed #panel { width: 52px; min-width: 52px; }
    #story-shell.panel-collapsed #step-nav,
    #story-shell.panel-collapsed #step-content,
    #story-shell.panel-collapsed #toolbar { display: none; }
    #story-shell.panel-collapsed #panel-header { padding: 12px; }
    #story-shell.narrow { flex-direction: column; }
    #story-shell.narrow #canvas-wrap { min-height: 52vh; }
    #story-shell.narrow #panel { width: 100%; border-left: 0; border-top: 1px solid #e2e8f0; min-height: 48vh; }
    #story-shell.narrow #toolbar button { flex: 1; }
    #story-shell.overview-mode #step-content,
    #story-shell.overview-mode #toolbar { display: none; }
    #story-shell.narrow.panel-collapsed #panel { width: 100%; min-width: 0; min-height: 52px; }
    #btn-expand { position: absolute; top: 10px; right: 10px; z-index: 20; width: 28px; height: 28px; border-radius: 999px; border: 1px solid #cbd5e0; background: rgba(255,255,255,0.92); color: #4a5568; cursor: pointer; display: none; align-items: center; justify-content: center; padding: 0; }
    #btn-expand:hover { background: #edf2f7; }
    #detail-drawer { position: absolute; right: 0; top: 0; width: 280px; height: 100%; background: #ffffff; border-left: 1px solid #e2e8f0; padding: 16px; transform: translateX(100%); transition: transform 0.2s; overflow-y: auto; z-index: 10; }
    #detail-drawer.open { transform: translateX(0); }
    #drawer-node-id { font-size: 11px; color: #2563eb; margin-bottom: 8px; font-family: monospace; }
    #edge-tooltip { position: fixed; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 4px; padding: 6px 10px; font-size: 12px; color: #2d3748; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 280px; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    #edge-tooltip.visible { opacity: 1; }
    .focus-mode .d2-node.dimmed { display: none; }
    .focus-mode .d2-edge.dimmed { display: none; }
  </style>
</head>
<body>
  <div id="story-shell">
    <div id="canvas-wrap">
      <div id="svg-host">{{SVG_CONTENT}}</div>
      <button id="btn-expand" type="button" title="Open in full view" aria-label="Open in full view">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <polyline points="9,1 13,1 13,5"/><polyline points="5,13 1,13 1,9"/>
          <line x1="13" y1="1" x2="8" y2="6"/><line x1="1" y1="13" x2="6" y2="8"/>
        </svg>
      </button>
      <div id="detail-drawer">
        <div id="drawer-node-id"></div>
        <div id="drawer-body"></div>
      </div>
    </div>
    <div id="panel">
      <div id="panel-header">
        <button id="btn-panel-toggle" type="button" title="Collapse narration" aria-label="Collapse narration" aria-expanded="true">></button>
      </div>
      <div id="step-nav">{{STEP_BUTTONS}}</div>
      <div id="step-content">
        <div id="step-tag"></div>
        <div id="step-title"></div>
        <div id="step-body"></div>
      </div>
      <div id="toolbar">
        <button id="btn-prev" type="button">← Prev</button>
        <button id="btn-next" type="button">Next →</button>
        <button id="btn-focus" type="button" title="Toggle focus mode">● Focus</button>
      </div>
    </div>
  </div>
  <div id="edge-tooltip"></div>

  {{SVG_PAN_ZOOM_SCRIPT_TAG}}
  {{VIEWER_RUNTIME_SCRIPT_TAG}}
  <script>
    const _cfg = {{VIEWER_CONFIG_JSON}};
    const _p = new URLSearchParams(location.search);
    const config = {
      ..._cfg,
      ...(_p.has('expandable') ? { expandable: true } : {}),
      ...(_p.has('minInitialZoom') ? { minInitialZoom: parseFloat(_p.get('minInitialZoom') ?? '') } : {}),
      ...(_p.has('narrowBreakpoint') ? { narrowBreakpoint: parseInt(_p.get('narrowBreakpoint') ?? '', 10) } : {}),
    };
    const ViewerCtor = window.DiaScopeBundle?.DiaScopeViewer ?? window.DiaScopeViewer;
    if (!ViewerCtor) {
      console.error("DiaScope viewer bundle did not expose a browser-global viewer constructor.");
    } else {
      const viewer = new ViewerCtor({ ...config, autoBindControls: true });
      viewer.init();
    }
  </script>
</body>
</html>
