meta:
  title: "Compliant GPU Blueprint"
  d2_source: deployment.d2
  d2_theme: 200

detail_panels:
  HealthcareProvider.Controls.ClientAuth: |
    <p>This is the last provider-controlled gate before clinical context leaves the current hosting boundary.</p>
    <p>It matters because the outbound call defines the point where external processing, contractual scope, and evidence requirements begin.</p>
  Biolytics.Runtime.Ingress: |
    <p>The external processing environment should only accept traffic from explicitly allowlisted client endpoints.</p>
  GPUProvider.EURegion: |
    <p>Region locking and residency evidence are prerequisites, not optional deployment preferences.</p>
  Audit.ProviderEvidence: |
    <p>For managed inference offerings, more of the control burden shifts into this evidence pack: certifications, tenancy claims, statelessness guarantees, and audit scope.</p>

edge_tooltips:
  "authenticated request carrying clinical context": "This edge marks the handoff into externally hosted AI processing."
  "writes operational metadata": "Audit events should avoid plaintext prompt and response content."
  "provider access and facility trail": "Infrastructure-side evidence remains necessary even when the application stack is self-managed."

steps:
  - id: boundary-handoff
    tag: "01"
    title: "Start at the boundary where external processing begins"
    body: |
      The key compliance question is not "where is the model?" but "where does
      provider-controlled clinical context leave its current environment?" That
      happens at the authenticated handoff into the external processing enclave.
      From this point onward, the deployment needs a processor-grade control model,
      not just an engineering diagram.
    nodes:
      - HealthcareProvider.Controls.ClientAuth
      - Biolytics.Runtime.Ingress
      - Biolytics.Runtime.TLS

  - id: controller-side-gates
    tag: "02"
    title: "The healthcare provider must decide what is allowed to cross that boundary"
    body: |
      Before any request leaves the EHR environment, the healthcare provider still owns the
      authorization decision and the outbound identity used for the call. This is
      where use of AI assistance must be explicitly permitted and constrained. If
      minimisation, authorization, or caller authentication are weak here, nothing
      downstream can make the overall flow compliant again.
    nodes:
      - HealthcareProvider.App.EHR
      - HealthcareProvider.Controls.Authz
      - HealthcareProvider.Controls.ClientAuth

  - id: responsibility-split
    tag: "03"
    title: "The blueprint is really a split of responsibilities"
    body: |
      The healthcare provider remains the controller because the processing serves its EHR
      workflows and patient context. Biolytics operates the external application
      layer and therefore has to implement processor-grade safeguards. The GPU
      hosting company remains a sub-processor or infrastructure party whose claims
      still need to be contractually and evidentially verified.
    nodes:
      - HealthcareProvider
      - Biolytics
      - GPUProvider

  - id: provider-prerequisites
    tag: "04"
    title: "A GPU provider is not acceptable without legal and evidence prerequisites"
    body: |
      Region locking, provider certifications, and signed processor terms are
      onboarding prerequisites. This matters even more for managed inference
      offerings, where more operational control sits with the provider and more
      trust has to be established through evidence rather than direct implementation
      choices. In other words: provider claims about residency, isolation, and
      statelessness have to be reviewable before production traffic is allowed.
    nodes:
      - GPUProvider.EURegion
      - GPUProvider.Hypervisor
      - Audit.DPA
      - Audit.ProviderEvidence

  - id: rented-gpu-blueprint
    tag: "05"
    title: "The rented-GPU model becomes the compliance blueprint"
    body: |
      This example treats the self-managed GPU model as the reference architecture
      because it shows the safeguards that must exist when more of the stack is in
      your own operational scope. The external runtime needs controlled ingress, controlled
      operations access, encrypted storage, model provenance, and PHI-safe audit
      logging. The Biolytics solution should be judged against this same control
      baseline, even if its product behavior sits above the raw inference layer.
    nodes:
      - Biolytics.Runtime.Ingress
      - Biolytics.Runtime.OpsAccess
      - Biolytics.Runtime.Inference
      - Biolytics.Storage.EncVolume
      - Biolytics.Storage.Weights
      - Biolytics.Storage.SafeAudit
      - GPUProvider.GPU

  - id: oversight-and-return
    tag: "06"
    title: "The response returns, but oversight stays with the controller"
    body: |
      A compliant setup does not end when the model returns an answer. The healthcare provider
      still needs evidence it can review: application audit logs, infrastructure
      access trails, deployment provenance, key rotation records, and the provider
      evidence pack. That is the practical point of the blueprint: to align all
      parties on what must be reviewable when PHI-capable processing happens
      outside the current hosting environment.
    nodes:
      - Biolytics.Runtime.TLS
      - HealthcareProvider.App.EHR
      - HealthcareProvider.Actors.DPO
      - Audit.AppLog
      - Audit.InfraLog
      - Audit.DeployProv
      - Audit.KeyLog
      - Audit.ProviderEvidence
