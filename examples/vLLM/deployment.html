  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: system-ui, sans-serif; background: #0f1117; color: #e2e8f0; }
    #canvas-wrap { flex: 1; position: relative; overflow: hidden; }
    #svg-host { width: 100%; height: 100%; }
    #svg-host svg { display: block; }
    #panel { width: 320px; display: flex; flex-direction: column; border-left: 1px solid #2d3748; background: #161b27; }
    #step-nav { display: flex; flex-wrap: wrap; gap: 4px; padding: 12px; border-bottom: 1px solid #2d3748; }
    .step-btn { padding: 4px 10px; border-radius: 4px; border: 1px solid #4a5568; background: transparent; color: #a0aec0; cursor: pointer; font-size: 12px; }
    .step-btn.active { background: #3182ce; border-color: #3182ce; color: #fff; }
    #step-content { flex: 1; overflow-y: auto; padding: 16px; }
    #step-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #4a90d9; margin-bottom: 6px; }
    #step-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    #step-body { font-size: 13px; color: #a0aec0; line-height: 1.6; }
    #toolbar { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid #2d3748; }
    #toolbar button { flex: 1; padding: 5px 0; border-radius: 4px; border: 1px solid #4a5568; background: transparent; color: #a0aec0; cursor: pointer; font-size: 11px; }
    #toolbar button:hover { background: #2d3748; }
    #detail-drawer { position: absolute; right: 0; top: 0; width: 280px; height: 100%; background: #1a202c; border-left: 1px solid #2d3748; padding: 16px; transform: translateX(100%); transition: transform 0.2s; overflow-y: auto; z-index: 10; }
    #detail-drawer.open { transform: translateX(0); }
    #drawer-node-id { font-size: 11px; color: #4a90d9; margin-bottom: 8px; font-family: monospace; }
    #edge-tooltip { position: fixed; background: #2d3748; border: 1px solid #4a5568; border-radius: 4px; padding: 6px 10px; font-size: 12px; pointer-events: none; opacity: 0; transition: opacity 0.1s; max-width: 280px; z-index: 100; }
    #edge-tooltip.visible { opacity: 1; }
    .focus-mode .d2-node.dimmed { display: none; }
    .focus-mode .d2-edge.dimmed { display: none; }
  </style>

  "steps": [
    {
      "tag": "01",
      "title": "Start at the boundary where external processing begins",
      "body": "The key compliance question is not \"where is the model?\" but \"where does\nHealthcareProvider-controlled clinical context leave its current environment?\" That\nhappens at the authenticated handoff into the external processing enclave.\nFrom this point onward, the deployment needs a processor-grade control model,\nnot just an engineering diagram.\n",
      "nodes": [
        "HealthcareProvider.Controls.ClientAuth",
        "Biolytics.Runtime.Ingress",
        "Biolytics.Runtime.TLS"
      ]
    },
    {
      "tag": "02",
      "title": "HealthcareProvider must decide what is allowed to cross that boundary",
      "body": "Before any request leaves the EHR environment, HealthcareProvider still owns the\nauthorization decision and the outbound identity used for the call. This is\nwhere use of AI assistance must be explicitly permitted and constrained. If\nminimisation, authorization, or caller authentication are weak here, nothing\ndownstream can make the overall flow compliant again.\n",
      "nodes": [
        "HealthcareProvider.App.EHR",
        "HealthcareProvider.Controls.Authz",
        "HealthcareProvider.Controls.ClientAuth"
      ]
    },
    {
      "tag": "03",
      "title": "The blueprint is really a split of responsibilities",
      "body": "HealthcareProvider remains the controller because the processing serves its EHR\nworkflows and patient context. Biolytics operates the external application\nlayer and therefore has to implement processor-grade safeguards. The GPU\nhosting company remains a sub-processor or infrastructure party whose claims\nstill need to be contractually and evidentially verified.\n",
      "nodes": [
        "HealthcareProvider",
        "Biolytics",
        "GPUProvider"
      ]
    },
    {
      "tag": "04",
      "title": "A GPU provider is not acceptable without legal and evidence prerequisites",
      "body": "Region locking, provider certifications, and signed processor terms are\nonboarding prerequisites. This matters even more for managed inference\nofferings, where more operational control sits with the provider and more\ntrust has to be established through evidence rather than direct implementation\nchoices. In other words: provider claims about residency, isolation, and\nstatelessness have to be reviewable before production traffic is allowed.\n",
      "nodes": [
        "GPUProvider.EURegion",
        "GPUProvider.Hypervisor",
        "Audit.DPA",
        "Audit.ProviderEvidence"
      ]
    },
    {
      "tag": "05",
      "title": "The rented-GPU model becomes the compliance blueprint",
      "body": "This example treats the self-managed GPU model as the reference architecture\nbecause it shows the safeguards that must exist when more of the stack is in\nyour own beheer. The external runtime needs controlled ingress, controlled\noperations access, encrypted storage, model provenance, and PHI-safe audit\nlogging. The Biolytics solution should be judged against this same control\nbaseline, even if its product behavior sits above the raw inference layer.\n",
      "nodes": [
        "Biolytics.Runtime.Ingress",
        "Biolytics.Runtime.OpsAccess",
        "Biolytics.Runtime.Inference",
        "Biolytics.Storage.EncVolume",
        "Biolytics.Storage.Weights",
        "Biolytics.Storage.SafeAudit",
